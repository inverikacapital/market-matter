# Runs the Inverika Market Matter sweep every weekday after the NSE close and commits the result,
# so the page always shows the latest session. Can also be run by hand from the Actions tab.
name: Market Matter daily sweep

on:
  schedule:
    - cron: "15 11 * * 1-5"    # Mon-Fri 11:15 UTC (16:45 IST), after the 15:30 IST close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-matter-commits          # never push at the same moment as another workflow
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sweep/requirements.txt

      - name: Install
        run: pip install -r sweep/requirements.txt

      - name: Run sweep
        run: python sweep/sweep.py --out data

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Market Matter sweep ($(date -u +%F))"
            git pull --rebase
            git push
          fi

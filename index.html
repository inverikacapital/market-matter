<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inverika Market Matter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
:root {
  --bg: #f3f4f7; --surface: #ffffff; --ink: #151821; --muted: #5b6172; --line: #dcdfe7; --accent: #2f3fb8;
  --f-display: "Source Serif 4", Georgia, serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1117; --surface: #171a23; --ink: #e8eaf1; --muted: #9ba1b0; --line: #2a2e3b; --accent: #8f9cff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1117; --surface: #171a23; --ink: #e8eaf1; --muted: #9ba1b0; --line: #2a2e3b; --accent: #8f9cff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); }
main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 48px; display: flex; flex-direction: column; gap: 20px; }
h1 { margin: 0; font: 600 clamp(24px, 3.4vw, 32px)/1.2 var(--f-display); }
.lede { margin: 0; color: var(--muted); max-width: 75ch; line-height: 1.55; }
footer { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Inverika Market Matter</h1>
    <p class="lede">A daily sweep of the Indian stock market, published automatically every weekday after the NSE close.
      Drivers describe what moved alongside the market; they are not proof of cause. Not investment advice.</p>
  </header>
  <market-matter src="data/latest.json" archive="data/index.json"></market-matter>
  <footer>Built by Manisha Hebbar for Inverika.</footer>
</main>
<script src="market-matter.js?v=1"></script>
</body>
</html>
